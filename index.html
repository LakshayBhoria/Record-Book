<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Record Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (optional): only used once you paste your own project config into
     Settings -> Backup & Sync -> Cloud Setup. Loading these scripts does nothing
     and makes no network calls of consequence until you connect a project. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F3ECDA;
    --paper-deep:#EAE0C2;
    --rule:#CBB98D;
    --rule-soft:#DED1AC;
    --ink:#211D18;
    --ink-soft:#5B5449;
    --ink-faint:#8B8271;
    --red:#A13A32;
    --red-soft:#C65B4E;
    --red-wash:#F1DCD8;
    --green:#3A5F41;
    --green-soft:#4F7A57;
    --green-wash:#DEE7DC;
    --brass:#9C7A3C;
    --brass-soft:#C9A768;
    --cloth:#5C1414;
    --cloth-dark:#3A0D0D;
    --cloth-light:#7A2020;
    --card:#FBF7EA;
    --card-shadow: 0 1px 2px rgba(33,29,24,0.06), 0 4px 14px rgba(33,29,24,0.07);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--cloth-dark);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Fraunces', serif;}
  ::selection{background:var(--brass-soft); color:var(--ink);}

  /* ---------- layout ---------- */
  .app{display:flex; min-height:100vh; align-items:stretch;}

  .spine{
    width:224px; flex-shrink:0;
    background:
      radial-gradient(circle at 10px 0, transparent 6px, var(--cloth) 6.5px) 0 0/100% 34px repeat-y,
      linear-gradient(135deg, var(--cloth-light), var(--cloth) 45%, var(--cloth-dark));
    position:relative;
    padding:26px 0 26px 22px;
    display:flex; flex-direction:column;
  }
  .spine::after{
    content:"";
    position:absolute; top:0; right:0; bottom:0; width:6px;
    background:linear-gradient(90deg, rgba(0,0,0,0.35), transparent);
  }
  .brand{
    padding:2px 18px 22px 4px;
    border-bottom:1px solid rgba(243,236,218,0.18);
    margin-bottom:14px;
  }
  .brand-mark{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:26px; color:var(--paper); line-height:1.1; letter-spacing:0.2px;
  }
  .brand-sub{
    color:rgba(243,236,218,0.6); font-size:10.5px; letter-spacing:1.6px;
    text-transform:uppercase; margin-top:5px;
  }
  .nav{display:flex; flex-direction:column; gap:2px; padding-right:0;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 16px 10px 14px;
    color:rgba(243,236,218,0.72);
    font-size:13.5px; font-weight:500;
    cursor:pointer; user-select:none;
    border-radius:5px 0 0 5px;
    position:relative;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:0.85;}
  .nav-item:hover{background:rgba(243,236,218,0.08); color:var(--paper);}
  .nav-item.active{
    background:var(--paper); color:var(--ink); font-weight:600;
  }
  .nav-item.active svg{opacity:1; color:var(--red);}
  .nav-item.active::after{
    content:""; position:absolute; right:-1px; top:0; bottom:0; width:4px; background:var(--brass);
  }
  .nav-divider{height:1px; background:rgba(243,236,218,0.14); margin:12px 16px 12px 4px;}
  .spine-foot{margin-top:auto; padding:14px 18px 0 4px; color:rgba(243,236,218,0.4); font-size:10.5px; line-height:1.5;}

  .page{
    flex:1; min-width:0;
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 35px, var(--rule-soft) 36px);
    position:relative;
    overflow-x:hidden;
  }
  .page::before{
    content:"";
    position:absolute; top:0; bottom:0; left:74px; width:1px;
    background:var(--red-soft); opacity:0.55;
  }
  .page-inner{
    position:relative; z-index:1;
    padding:30px 40px 60px 100px;
    max-width:1180px;
  }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:10px;
  }
  .topbar h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:27px; margin:0;
    color:var(--ink);
  }
  .topbar .biz{
    font-size:12.5px; color:var(--ink-faint);
  }
  .topbar .biz b{color:var(--ink-soft); font-weight:600;}
  .topbar .today{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--brass);
    letter-spacing:0.3px;
  }

  /* ---------- stat cards ---------- */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .stat-card{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    padding:15px 16px; box-shadow:var(--card-shadow);
  }
  .stat-label{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .stat-value{font-family:'IBM Plex Mono', monospace; font-size:23px; font-weight:600;}
  .stat-value.red{color:var(--red);}
  .stat-value.green{color:var(--green);}
  .stat-foot{font-size:11px; color:var(--ink-faint); margin-top:4px;}

  /* ---------- generic ---------- */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px 0; gap:10px; flex-wrap:wrap;}
  .section-head h2{font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin:0; color:var(--ink);}
  .section-head .count{font-size:11.5px; color:var(--ink-faint); margin-left:8px; font-weight:400;}

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:600;
    padding:8px 15px; border-radius:4px; border:1px solid transparent;
    cursor:pointer; transition:filter .12s ease, transform .05s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--cloth); color:var(--paper);}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-outline{background:transparent; border-color:var(--brass); color:var(--brass);}
  .btn-outline:hover{background:rgba(156,122,60,0.1);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--rule);}
  .btn-ghost:hover{background:var(--paper-deep);}
  .btn-danger{background:transparent; color:var(--red); border-color:var(--red-soft);}
  .btn-danger:hover{background:var(--red-wash);}
  .btn-sm{padding:5px 10px; font-size:11.5px;}
  .btn svg{width:14px; height:14px;}

  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--rule); border-radius:4px; padding:7px 11px; max-width:280px;
    margin-bottom:12px;
  }
  .searchbar svg{width:14px; height:14px; color:var(--ink-faint); flex-shrink:0;}
  .searchbar input{border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--ink); font-family:'IBM Plex Sans';}

  .card{background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--card-shadow); overflow:hidden;}
  .card-pad{padding:18px 20px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:0.8px; text-transform:uppercase;
    color:var(--ink-faint); font-weight:600; padding:10px 14px; border-bottom:1.5px solid var(--rule);
    background:var(--paper-deep);
  }
  tbody td{padding:10px 14px; border-bottom:1px solid var(--rule-soft); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:rgba(156,122,60,0.07);}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono', monospace;}
  td.amt-red{color:var(--red); font-family:'IBM Plex Mono', monospace; font-weight:600;}
  td.amt-green{color:var(--green); font-family:'IBM Plex Mono', monospace; font-weight:600;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px; border-radius:3px; display:inline-flex;
  }
  .icon-btn:hover{color:var(--red); background:var(--red-wash);}
  .icon-btn svg{width:14px; height:14px;}

  .chip{display:inline-block; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:20px; letter-spacing:0.3px;}
  .chip-green{background:var(--green-wash); color:var(--green);}
  .chip-red{background:var(--red-wash); color:var(--red);}
  .chip-brass{background:rgba(156,122,60,0.16); color:var(--brass);}
  .chip-grey{background:var(--paper-deep); color:var(--ink-soft);}

  .empty{
    text-align:center; padding:46px 20px; color:var(--ink-faint);
  }
  .empty svg{width:34px; height:34px; margin-bottom:10px; opacity:0.5;}
  .empty p{font-size:13px; margin:2px 0;}
  .empty .lead{font-family:'Fraunces', serif; font-style:italic; font-size:16px; color:var(--ink-soft); margin-bottom:4px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,15,10,0.55); backdrop-filter:blur(1px);
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px;
    z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--paper); border:1px solid var(--rule); border-radius:6px;
    width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,0.35);
    animation:pop .14s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(0.99);} to{opacity:1; transform:translateY(0) scale(1);}}
  .modal.wide{max-width:820px;}
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px; border-bottom:1px solid var(--rule);
  }
  .modal-head h3{font-family:'Fraunces', serif; font-size:18px; font-weight:600; margin:0;}
  .modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--rule); display:flex; justify-content:flex-end; gap:10px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:4px;
    background:var(--card); font-family:'IBM Plex Sans'; font-size:13.5px; color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brass);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .hint{font-size:11px; color:var(--ink-faint); margin-top:4px;}

  .line-table{width:100%; border-collapse:collapse; margin-bottom:10px;}
  .line-table th{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); text-align:left; padding:0 6px 6px;}
  .line-table td{padding:4px 6px; vertical-align:middle;}
  .line-table input, .line-table select{padding:6px 7px; font-size:12.5px; border:1px solid var(--rule); border-radius:3px; background:var(--card); width:100%;}
  .line-amt{font-family:'IBM Plex Mono', monospace; font-size:12.5px; text-align:right; white-space:nowrap; padding-right:8px;}

  .totals-box{margin-top:8px; padding-top:10px; border-top:1px dashed var(--rule);}
  .totals-row{display:flex; justify-content:space-between; padding:3px 0; font-size:13px; color:var(--ink-soft);}
  .totals-row.grand{font-size:17px; font-weight:700; color:var(--ink); border-top:1px solid var(--rule); margin-top:6px; padding-top:8px;}
  .totals-row .val{font-family:'IBM Plex Mono', monospace;}

  .tabs-sub{display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; border-bottom:1px solid var(--rule); padding-bottom:0;}
  .tab-sub{
    padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--ink-faint); cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab-sub:hover{color:var(--ink-soft);}
  .tab-sub.active{color:var(--red); border-bottom-color:var(--red);}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:5px; font-size:12.5px;
    box-shadow:0 8px 24px rgba(0,0,0,0.3); display:flex; align-items:center; gap:8px;
    animation:slideIn .18s ease;
  }
  .toast svg{width:14px; height:14px; color:var(--green-soft); flex-shrink:0;}
  @keyframes slideIn{from{opacity:0; transform:translateX(14px);} to{opacity:1; transform:translateX(0);}}

  .party-type-toggle{display:flex; gap:8px;}
  .party-type-toggle label{
    flex:1; text-align:center; padding:8px; border:1px solid var(--rule); border-radius:4px; cursor:pointer;
    font-size:12.5px; font-weight:600; color:var(--ink-faint);
  }
  .party-type-toggle input{display:none;}
  .party-type-toggle input:checked + span{color:var(--red);}
  .party-type-toggle label:has(input:checked){border-color:var(--red-soft); background:var(--red-wash);}

  .balance-banner{
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-radius:5px;
    margin-bottom:16px; border:1px solid var(--rule);
  }
  .balance-banner .l{font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.5px;}
  .balance-banner .v{font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:700;}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--rule); border-radius:6px;}

  @media (max-width:820px){
    .spine{width:64px; padding-left:0; align-items:center;}
    .brand{padding:0 0 16px 0; text-align:center;}
    .brand-sub{display:none;}
    .brand-mark{font-size:20px;}
    .nav-item{padding:11px; justify-content:center; border-radius:5px;}
    .nav-item span.label{display:none;}
    .nav-item.active::after{display:none;}
    .spine-foot{display:none;}
    .page::before{left:22px;}
    .page-inner{padding:22px 16px 50px 40px;}
    .field-row, .field-row3{grid-template-columns:1fr;}
  }
  /* ---------- auth screen ---------- */
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:
    radial-gradient(circle at 10px 0, transparent 6px, var(--cloth) 6.5px) 0 0/100% 34px repeat-y,
    linear-gradient(135deg, var(--cloth-light), var(--cloth) 45%, var(--cloth-dark)); padding:24px;}
  .auth-card{width:100%; max-width:380px; background:var(--card); border-radius:6px; box-shadow:0 12px 40px rgba(0,0,0,0.35); padding:28px 26px 22px;}
  .auth-brand{font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size:24px; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .auth-brand svg{color:var(--red);}
  .auth-sub{font-size:12px; color:var(--ink-faint); margin:4px 0 18px;}
  .auth-tabs{display:flex; border-bottom:1px solid var(--rule); margin-bottom:16px;}
  .auth-tab{flex:1; text-align:center; padding:9px 0; font-size:13px; font-weight:600; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .auth-tab.active{color:var(--red); border-bottom-color:var(--red);}
  .auth-err{background:var(--red-wash); color:var(--red); font-size:12.5px; padding:8px 10px; border-radius:4px; margin:4px 0 2px;}
  .auth-foot{font-size:11px; color:var(--ink-faint); text-align:center; margin-top:16px; line-height:1.5;}
  /* ---------- printable invoice ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:20px; background:#fff;}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="toastWrap" class="toast-wrap"></div>

<script>
/* ============================= ICONS ============================= */
const ICONS = {
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8" rx="1"/><path d="M6 17H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2"/></svg>',

  payments:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 15.2c.5.9 1.5 1.3 2.6 1.3 1.7 0 2.9-.9 2.9-2.1 0-1.3-1.1-1.8-2.9-2.2-1.8-.4-2.9-.9-2.9-2.2 0-1.2 1.2-2.1 2.9-2.1 1.1 0 2.1.4 2.6 1.3"/><path d="M12 6.5v11"/></svg>',
  expenses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1h-5a2 2 0 0 0 0 4h5"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',

/* ============================= HELPERS ============================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ n = Number(n)||0; const s = n<0?'-':''; return s + '₹' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtInt(n){ n=Number(n)||0; return n.toLocaleString('en-IN'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function uid(prefix){
  App.state.seq[prefix] = (App.state.seq[prefix]||0) + 1;
  return prefix + '-' + String(App.state.seq[prefix]).padStart(4,'0');
}
function nowTs(){ return Date.now(); }

/* ============================= STORAGE / CLOUD SYNC =============================
   Three possible backends, auto-selected in this order:
   1. 'firebase' — a real cloud backend (Firebase Auth + Firestore) once you paste
      your own free Firebase project config into Settings -> Backup & Sync. This
      is the one that gives genuine production-grade login security and true
      cross-device sync independent of Claude, plus automatic daily backups.
   2. 'claude'   — the built-in window.storage bridge, only present when this
      page runs inside a Claude artifact. Good for trying things out, syncs
      across devices as long as you're opening it inside Claude.
   3. 'local'    — plain browser localStorage. Works anywhere, but each device
      keeps its own separate copy.
*/
const CloudConfig = {
  KEY:'rb_firebase_config',
  get(){ try{ const v = localStorage.getItem(this.KEY); return v? JSON.parse(v) : null; }catch(e){ return null; } },
  set(cfg){ localStorage.setItem(this.KEY, JSON.stringify(cfg)); },
  clear(){ localStorage.removeItem(this.KEY); }
};

const Store = {
  mode:'local', // 'firebase' | 'claude' | 'local'
  db:null, fbAuth:null, firebaseError:'',

  async init(){
    const cfg = CloudConfig.get();
    if(cfg && typeof firebase!=='undefined'){
      try{
        const app = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(cfg);
        this.fbAuth = firebase.auth();
        this.db = firebase.firestore();
        this.mode = 'firebase';
        return;
      }catch(e){ this.firebaseError = e.message || 'Could not connect to Firebase.'; }
    }
    this.mode = (typeof window!=='undefined' && !!window.storage) ? 'claude' : 'local';
  },

  get cloudAvailable(){ return this.mode==='firebase' || this.mode==='claude'; },

  // shared/personal are only used by the 'claude' and 'local' auth backends
  async getShared(key){
    if(this.mode==='claude'){
      try{ const r = await window.storage.get(key, true); return r? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    const v = localStorage.getItem('rb_shared_'+key); return v? JSON.parse(v) : null;
  },
  async setShared(key, val){
    if(this.mode==='claude'){
      try{ await window.storage.set(key, JSON.stringify(val), true); return true; }
      catch(e){ return false; }
    }
    localStorage.setItem('rb_shared_'+key, JSON.stringify(val)); return true;
  },
  async getPersonal(key){
    if(this.mode==='claude'){
      try{ const r = await window.storage.get(key, false); return r? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    const v = localStorage.getItem('rb_local_'+key); return v? JSON.parse(v) : null;
  },
  async setPersonal(key, val){
    if(this.mode==='claude'){
      try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
      catch(e){ return false; }
    }
    localStorage.setItem('rb_local_'+key, JSON.stringify(val)); return true;
  }
};

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============================= AUTH ============================= */
const Auth = {
  session: null, // {username} for local/claude modes, or {uid,email} for firebase
  err: '',
  mode: 'login', // 'login' | 'signup'
  busy: false,

  async boot(){
    if(Store.mode==='firebase'){
      return new Promise(resolve=>{
        Store.fbAuth.onAuthStateChanged(user=>{
          if(user){ this.session = {uid:user.uid, email:user.email}; resolve(true); }
          else resolve(false);
        });
      });
    }
    const sess = await Store.getPersonal('rb-session');
    if(sess && sess.username){
      const users = (await Store.getShared('rb-users')) || {};
      if(users[sess.username]){ this.session = sess; return true; }
    }
    return false;
  },

  render(){
    const isLogin = this.mode==='login';
    const fb = Store.mode==='firebase';
    document.getElementById('root').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <div class="auth-brand">${ICONS.book} Record Book</div>
          <div class="auth-sub">${fb? 'Cloud-synced billing &amp; accounting (Firebase)' : Store.cloudAvailable? 'Cloud-synced billing &amp; accounting' : 'Local billing &amp; accounting — connect Firebase in Settings for cloud sync'}</div>
          <div class="auth-tabs">
            <div class="auth-tab ${isLogin?'active':''}" onclick="Auth.mode='login'; Auth.err=''; Auth.render();">Log In</div>
            <div class="auth-tab ${!isLogin?'active':''}" onclick="Auth.mode='signup'; Auth.err=''; Auth.render();">Create Account</div>
          </div>
          <div class="auth-body">
            ${!isLogin? `<div class="field"><label>Business name</label><input id="a_biz" placeholder="e.g. Kaveri Stationery"></div>` : ''}
            <div class="field"><label>${fb?'Email':'Username'}</label><input id="a_user" type="${fb?'email':'text'}" autocomplete="username" placeholder="${fb?'you@business.com':'e.g. kaveri_store'}"></div>
            <div class="field"><label>Password</label><input id="a_pass" type="password" autocomplete="${isLogin?'current-password':'new-password'}" placeholder="••••••••"></div>
            ${!isLogin? `<div class="field"><label>Confirm password</label><input id="a_pass2" type="password" placeholder="••••••••"></div>` : ''}
            ${this.err? `<div class="auth-err">${esc(this.err)}</div>` : ''}
            <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:6px;" ${this.busy?'disabled':''} onclick="Auth.${isLogin?'login':'signup'}()">${this.busy? 'Please wait…' : (isLogin? 'Log In':'Create Account')}</button>
          </div>
          <div class="auth-foot">${fb? 'Secured by Firebase Authentication — your ledger backs up automatically every day.' : Store.cloudAvailable? 'Your login and ledger sync automatically wherever you open Record Book.' : 'Data is saved to this browser only until you connect Firebase (Settings → Backup & Sync).'}</div>
        </div>
      </div>
    `;
  },

  async signup(){
    if(Store.mode==='firebase') return this.signupFirebase();
    const biz = document.getElementById('a_biz').value.trim();
    const user = document.getElementById('a_user').value.trim().toLowerCase();
    const pass = document.getElementById('a_pass').value;
    const pass2 = document.getElementById('a_pass2').value;
    if(!biz){ this.err='Business name is required.'; this.render(); return; }
    if(!/^[a-z0-9_.]{3,24}$/.test(user)){ this.err='Username must be 3-24 characters: letters, numbers, _ or .'; this.render(); return; }
    if(pass.length<6){ this.err='Password must be at least 6 characters.'; this.render(); return; }
    if(pass!==pass2){ this.err='Passwords do not match.'; this.render(); return; }
    this.busy=true; this.err=''; this.render();
    const users = (await Store.getShared('rb-users')) || {};
    if(users[user]){ this.busy=false; this.err='That username is already taken.'; this.render(); return; }
    const passHash = await sha256(pass);
    users[user] = { passHash, businessName: biz, createdAt: Date.now() };
    await Store.setShared('rb-users', users);
    const biz0 = App.defaultState();
    biz0.business.name = biz;
    await Store.setShared('rb-biz-'+user, biz0);
    await Store.setPersonal('rb-session', {username:user});
    this.session = {username:user};
    App.boot();
  },

  async login(){
    if(Store.mode==='firebase') return this.loginFirebase();
    const user = document.getElementById('a_user').value.trim().toLowerCase();
    const pass = document.getElementById('a_pass').value;
    if(!user||!pass){ this.err='Enter your username and password.'; this.render(); return; }
    this.busy=true; this.err=''; this.render();
    const users = (await Store.getShared('rb-users')) || {};
    const rec = users[user];
    if(!rec){ this.busy=false; this.err='No account found with that username.'; this.render(); return; }
    const hash = await sha256(pass);
    if(hash!==rec.passHash){ this.busy=false; this.err='Incorrect password.'; this.render(); return; }
    await Store.setPersonal('rb-session', {username:user});
    this.session = {username:user};
    App.boot();
  },

  async signupFirebase(){
    const biz = document.getElementById('a_biz').value.trim();
    const email = document.getElementById('a_user').value.trim();
    const pass = document.getElementById('a_pass').value;
    const pass2 = document.getElementById('a_pass2').value;
    if(!biz){ this.err='Business name is required.'; this.render(); return; }
    if(pass.length<6){ this.err='Password must be at least 6 characters.'; this.render(); return; }
    if(pass!==pass2){ this.err='Passwords do not match.'; this.render(); return; }
    this.busy=true; this.err=''; this.render();
    try{
      const cred = await Store.fbAuth.createUserWithEmailAndPassword(email, pass);
      const uid = cred.user.uid;
      const state = App.defaultState();
      state.business.name = biz;
      await Store.db.collection('businesses').doc(uid).set(state);
      this.session = {uid, email};
      App.boot();
    }catch(e){ this.busy=false; this.err = e.message || 'Could not create account.'; this.render(); }
  },

  async loginFirebase(){
    const email = document.getElementById('a_user').value.trim();
    const pass = document.getElementById('a_pass').value;
    if(!email||!pass){ this.err='Enter your email and password.'; this.render(); return; }
    this.busy=true; this.err=''; this.render();
    try{
      const cred = await Store.fbAuth.signInWithEmailAndPassword(email, pass);
      this.session = {uid:cred.user.uid, email:cred.user.email};
      App.boot();
    }catch(e){ this.busy=false; this.err = e.message || 'Could not log in.'; this.render(); }
  },

  async logout(){
    if(!confirm('Log out of Record Book?')) return;
    if(Store.mode==='firebase'){ try{ await Store.fbAuth.signOut(); }catch(e){} this.session=null; App.state=null; this.mode='login'; this.err=''; this.render(); return; }
    await Store.setPersonal('rb-session', null);
    this.session = null;
    App.state = null;
    this.mode='login'; this.err='';
    this.render();
  },

  async changePassword(oldPass, newPass){
    if(newPass.length<6) return {ok:false, msg:'New password must be at least 6 characters.'};
    if(Store.mode==='firebase'){
      try{
        const user = Store.fbAuth.currentUser;
        const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldPass);
        await user.reauthenticateWithCredential(cred);
        await user.updatePassword(newPass);
        return {ok:true};
      }catch(e){ return {ok:false, msg: e.message || 'Current password is incorrect.'}; }
    }
    const users = (await Store.getShared('rb-users')) || {};
    const rec = users[this.session.username];
    const oldHash = await sha256(oldPass);
    if(oldHash!==rec.passHash) return {ok:false, msg:'Current password is incorrect.'};
    rec.passHash = await sha256(newPass);
    await Store.setShared('rb-users', users);
    return {ok:true};
  }
};

    const pA4 = mk(s.items,'IT',{name:'A4 Paper Ream', unit:'Pcs', salePrice:320, purchasePrice:270, tax:12, stock:18, lowStock:15});

    const cRohan = mk(s.parties,'P',{name:'Rohan Enterprises', type:'customer', phone:'99001 44556', gstin:'', opening:0});

      const id = mk(s.invoices,'INV',{date, partyId, lines:items, subtotal, taxTotal, discount:discount||0, total, createdAt: new Date(date).getTime()});
      items.forEach(l=>{ const it = s.items.find(i=>i.id===l.itemId); it.stock -= l.qty; });
      if(receivedNow>0){ mk(s.payments,'PAY',{date, partyId, type:'in', amount:receivedNow, mode:mode||'Cash', note:'', refType:'invoice', refId:id, createdAt:new Date(date).getTime()+1}); }

    function addPurchase(partyId, date, lines, discount, paidNow, mode){

  async init(){
    document.getElementById('root').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#F3ECDA;font-family:IBM Plex Sans,sans-serif;">Opening Record Book…</div>';
    await Store.init();
    const loggedIn = await Auth.boot();
    if(loggedIn){ await this.boot(); } else { Auth.render(); }
  },

  async boot(){
    let loaded = null;
    if(Store.mode==='firebase'){
      try{
        const snap = await Store.db.collection('businesses').doc(Auth.session.uid).get();
        loaded = snap.exists? snap.data() : null;
      }catch(e){ loaded = null; }
    } else {
      const key = 'rb-biz-'+Auth.session.username;
      loaded = await Store.getShared(key);
      if(!loaded){ loaded = this.defaultState(); loaded.business.name = (await Store.getShared('rb-users'))?.[Auth.session.username]?.businessName || 'My Shop'; }
    }
    if(!loaded) loaded = this.defaultState();
    this.state = loaded;
    if(!this.state.seq) this.state.seq = {INV:0,PUR:0,PAY:0,EXP:0,P:0,IT:0};
    if(!this.state.invoiceSettings) this.state.invoiceSettings = this.defaultState().invoiceSettings;
    if(!this.state.settingsTab) this.state.settingsTab = 'profile';
    this.lastSynced = Date.now();
    this.render();
    this.maybeDailyBackup();
  },

  persist(){
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(async ()=>{
      if(!Auth.session) return;
      let ok = false;
      if(Store.mode==='firebase'){
        try{ await Store.db.collection('businesses').doc(Auth.session.uid).set(this.state); ok = true; this.maybeDailyBackup(); }
        catch(e){ ok = false; }
      } else {
        ok = await Store.setShared('rb-biz-'+Auth.session.username, this.state);
      }
      if(ok){ this.lastSynced = Date.now(); const el=document.getElementById('syncStamp'); if(el) el.textContent = this.syncLabel(); }
    }, 250);
  },
  syncLabel(){
    if(!this.lastSynced) return 'Not synced yet';
    const secs = Math.round((Date.now()-this.lastSynced)/1000);
    const when = secs<5? 'just now' : secs<60? secs+'s ago' : Math.round(secs/60)+'m ago';
    return (Store.cloudAvailable? 'Cloud-synced · ':'Saved locally · ') + when;
  },

  /* ---------- automatic daily backup (Firebase mode only) ---------- */
  async maybeDailyBackup(){
    if(Store.mode!=='firebase' || !Auth.session) return;
    const today = todayStr();
    if(this._backupDoneFor===today) return;
    this._backupDoneFor = today;
    try{
      await Store.db.collection('businesses').doc(Auth.session.uid)
        .collection('backups').doc(today)
        .set({ snapshot: this.state, savedAt: Date.now() });
    }catch(e){ /* best effort — doesn't block the app */ }
  },
  async listBackups(){
    if(Store.mode!=='firebase' || !Auth.session) return [];
    try{
      const q = await Store.db.collection('businesses').doc(Auth.session.uid)
        .collection('backups').orderBy('savedAt','desc').limit(14).get();
      return q.docs.map(d=>({id:d.id, savedAt:d.data().savedAt}));
    }catch(e){ return []; }
  },
  async restoreBackup(dateId){
    if(!confirm('Restore the backup from '+dateId+'? This replaces all current data with that day\'s snapshot.')) return;
    try{
      const doc = await Store.db.collection('businesses').doc(Auth.session.uid).collection('backups').doc(dateId).get();
      if(!doc.exists){ this.toast('Backup not found','error'); return; }
      this.state = doc.data().snapshot;
      if(!this.state.invoiceSettings) this.state.invoiceSettings = this.defaultState().invoiceSettings;
      this.persist(); this.render(); this.toast('Restored backup from '+dateId);
    }catch(e){ this.toast('Could not restore backup','error'); }
  },

  toast(msg, kind){
    const wrap = document.getElementById('toastWrap');
    const div = document.createElement('div');
    div.className='toast';
    div.innerHTML = (kind==='error'? ICONS.alert : ICONS.check) + '<span>'+esc(msg)+'</span>';
    wrap.appendChild(div);
    setTimeout(()=>{ div.style.opacity='0'; div.style.transition='opacity .25s'; setTimeout(()=>div.remove(),260); }, 2200);
  },

  setTab(tab){ this.state.activeTab = tab; this.state.search=''; this.render(); this.persist(); },
  setReportTab(tab){ this.state.reportTab = tab; this.render(); },

  /* ---------- derived ---------- */
  partyById(id){ return this.state.parties.find(p=>p.id===id); },
  itemById(id){ return this.state.items.find(i=>i.id===id); },

  partyBalance(party){
    const s = this.state;
    if(party.type==='customer'){
      const inv = s.invoices.filter(i=>i.partyId===party.id).reduce((a,i)=>a+i.total,0);
      const pay = s.payments.filter(p=>p.partyId===party.id && p.type==='in').reduce((a,p)=>a+p.amount,0);
      return (party.opening||0) + inv - pay;
    } else {
      const pur = s.purchases.filter(i=>i.partyId===party.id).reduce((a,i)=>a+i.total,0);
      const pay = s.payments.filter(p=>p.partyId===party.id && p.type==='out').reduce((a,p)=>a+p.amount,0);
      return (party.opening||0) + pur - pay;
    }
  },

  /* ---------- CRUD: items ---------- */
  saveItem(data, id){
    if(id){ Object.assign(this.itemById(id), data); this.toast('Item updated'); }
    else{ const nid = uid('IT'); this.state.items.push(Object.assign({id:nid, stock:Number(data.openingStock)||0}, data)); this.toast('Item added'); }
    this.persist(); this.closeModal(); this.render();
  },
  deleteItem(id){
    if(!confirm('Delete this item? This cannot be undone.')) return;
    this.state.items = this.state.items.filter(i=>i.id!==id);
    this.persist(); this.render(); this.toast('Item deleted');
  },

  /* ---------- CRUD: parties ---------- */
  saveParty(data, id){
    if(id){ Object.assign(this.partyById(id), data); this.toast('Party updated'); }
    else{ const nid = uid('P'); this.state.parties.push(Object.assign({id:nid}, data)); this.toast('Party added'); return nid; }
    this.persist(); this.closeModal(); this.render();
  },
  deleteParty(id){
    if(!confirm('Delete this party and keep their past transactions on record? The party will be removed from lists.')) return;
    this.state.parties = this.state.parties.filter(p=>p.id!==id);
    this.persist(); this.render(); this.toast('Party deleted');
  },

  /* ---------- CRUD: expenses ---------- */
  saveExpense(data, id){
    if(id){ Object.assign(this.state.expenses.find(e=>e.id===id), data); this.toast('Expense updated'); }
    else{ const nid = uid('EXP'); this.state.expenses.push(Object.assign({id:nid, createdAt:nowTs()}, data)); this.toast('Expense recorded'); }
    this.persist(); this.closeModal(); this.render();
  },
  deleteExpense(id){
    if(!confirm('Delete this expense entry?')) return;
    this.state.expenses = this.state.expenses.filter(e=>e.id!==id);
    this.persist(); this.render(); this.toast('Expense deleted');
  },

  /* ---------- CRUD: payments ---------- */
  savePayment(data){
    const nid = uid('PAY');
    this.state.payments.push(Object.assign({id:nid, createdAt:nowTs()}, data));
    this.persist(); this.closeModal(); this.render(); this.toast('Payment recorded');
  },
  deletePayment(id){
    const p = this.state.payments.find(x=>x.id===id);
    if(p && p.refType){ this.toast('This payment is linked to a '+p.refType+' — delete that entry instead.', 'error'); return; }
    if(!confirm('Delete this payment record?')) return;
    this.state.payments = this.state.payments.filter(x=>x.id!==id);
    this.persist(); this.render(); this.toast('Payment deleted');
  },

  /* ---------- CRUD: invoices / purchases ---------- */
  deleteInvoice(id){
    if(!confirm('Delete this sale? Stock will be restored and any linked payment removed.')) return;
    const inv = this.state.invoices.find(i=>i.id===id);
    inv.lines.forEach(l=>{ const it=this.itemById(l.itemId); if(it) it.stock += l.qty; });
    this.state.payments = this.state.payments.filter(p=>!(p.refType==='invoice' && p.refId===id));
    this.state.invoices = this.state.invoices.filter(i=>i.id!==id);
    this.persist(); this.render(); this.toast('Sale deleted');
  },
  deletePurchase(id){
    if(!confirm('Delete this purchase? Stock will be reduced back and any linked payment removed.')) return;
    const pur = this.state.purchases.find(i=>i.id===id);
    pur.lines.forEach(l=>{ const it=this.itemById(l.itemId); if(it) it.stock -= l.qty; });
    this.state.payments = this.state.payments.filter(p=>!(p.refType==='purchase' && p.refId===id));
    this.state.purchases = this.state.purchases.filter(i=>i.id!==id);
    this.persist(); this.render(); this.toast('Purchase deleted');
  },

  /* ---------- draft (new sale / purchase) ---------- */
  openDraft(kind){
    this.draft = { kind, partyId:'', date: todayStr(), lines:[{itemId:'', qty:1, rate:0, tax:0}], discount:0, receivedNow:0, mode:'Cash' };
    this.openModal(this.renderDraftModal(), 'wide');
  },
  draftAddLine(){
    const gst = this.draftPartyGst();
    this.draft.lines.push({itemId:'', qty:1, rate:0, tax: gst!=null? gst : 0});
    this.refreshModal();
  },
  draftRemoveLine(idx){ this.draft.lines.splice(idx,1); if(!this.draft.lines.length) this.draft.lines.push({itemId:'',qty:1,rate:0,tax:0}); this.refreshModal(); },
  draftPartyGst(){
    const p = this.draft.partyId && this.partyById(this.draft.partyId);
    return (p && p.gstRate!=null && p.gstRate!=='') ? Number(p.gstRate) : null;
  },
  draftSetItem(idx, itemId){
    const it = this.itemById(itemId);
    const l = this.draft.lines[idx];
    l.itemId = itemId;
    const gst = this.draftPartyGst();
    if(it){ l.rate = this.draft.kind==='sale' ? it.salePrice : it.purchasePrice; l.tax = gst!=null? gst : it.tax; }
    this.refreshModal();
  },
  draftSetField(idx, field, value){ this.draft.lines[idx][field] = Number(value)||0; this.refreshModal(); },
  draftSetMeta(field, value){
    this.draft[field] = value;
    if(field==='partyId'){
      const gst = this.draftPartyGst();
      if(gst!=null){ this.draft.lines.forEach(l=> l.tax = gst); this.toast('GST '+gst+'% auto-applied for this party'); }
    }
    this.refreshModal();
  },
  draftTotals(){
    const subtotal = this.draft.lines.reduce((a,l)=> a + (Number(l.qty)||0)*(Number(l.rate)||0), 0);
    const taxTotal = this.draft.lines.reduce((a,l)=> a + (Number(l.qty)||0)*(Number(l.rate)||0)*(Number(l.tax)||0)/100, 0);
    const total = Math.max(0, subtotal + taxTotal - (Number(this.draft.discount)||0));
    return {subtotal, taxTotal, total};
  },
  saveDraft(){
    const d = this.draft;
    if(!d.partyId){ this.toast('Please select a party', 'error'); return; }
    const validLines = d.lines.filter(l=>l.itemId && l.qty>0);
    if(!validLines.length){ this.toast('Add at least one item', 'error'); return; }
    const {subtotal, taxTotal, total} = this.draftTotals();
    const lines = validLines.map(l=>({itemId:l.itemId, name:this.itemById(l.itemId).name, qty:Number(l.qty), rate:Number(l.rate), tax:Number(l.tax)}));
    const received = Math.min(Number(d.receivedNow)||0, total) ;
    if(d.kind==='sale'){
      const id = uid('INV');
      this.state.invoices.push({id, date:d.date, partyId:d.partyId, lines, subtotal, taxTotal, discount:Number(d.discount)||0, total, createdAt:nowTs()});
      lines.forEach(l=>{ const it=this.itemById(l.itemId); it.stock -= l.qty; });
      if(received>0){ this.state.payments.push({id:uid('PAY'), date:d.date, partyId:d.partyId, type:'in', amount:received, mode:d.mode, note:'', refType:'invoice', refId:id, createdAt:nowTs()+1}); }
      this.toast('Sale '+id+' recorded');
    } else {
      const id = uid('PUR');
      this.state.purchases.push({id, date:d.date, partyId:d.partyId, lines, subtotal, taxTotal, discount:Number(d.discount)||0, total, createdAt:nowTs()});
      lines.forEach(l=>{ const it=this.itemById(l.itemId); it.stock += l.qty; });
      if(received>0){ this.state.payments.push({id:uid('PAY'), date:d.date, partyId:d.partyId, type:'out', amount:received, mode:d.mode, note:'', refType:'purchase', refId:id, createdAt:nowTs()+1}); }
      this.toast('Purchase '+id+' recorded');
    }
    this.persist(); this.closeModal(); this.render();
  },

  /* ---------- modal plumbing ---------- */
  openModal(html, size){
    let ov = document.getElementById('overlay');
    if(!ov){ ov = document.createElement('div'); ov.id='overlay'; ov.className='overlay'; document.body.appendChild(ov); }
    ov.innerHTML = '<div class="modal '+(size==='wide'?'wide':'')+'" id="modalBox">'+html+'</div>';
    ov.onclick = (e)=>{ if(e.target===ov) App.closeModal(); };
  },
  refreshModal(){
    const box = document.getElementById('modalBox');
    if(box) box.outerHTML = '<div class="modal wide" id="modalBox">'+this.renderDraftModal()+'</div>';
  },
  closeModal(){ const ov = document.getElementById('overlay'); if(ov) ov.remove(); this.draft=null; this.editingId=null; },

    root.innerHTML = `
      <div class="app">
        <div class="spine">
          <div class="brand">
            <div class="brand-mark">${ICONS.book} Record Book</div>
            <div class="brand-sub">Khata &amp; Billing</div>
          </div>

            ${this.navItem('dashboard','Dashboard','dashboard')}

            ${this.navItem('purchases','Purchases','purchases')}
            ${this.navItem('parties','Parties','parties')}
            ${this.navItem('items','Items','items')}
            ${this.navItem('payments','Payments','payments')}
            ${this.navItem('expenses','Expenses','expenses')}
            <div class="nav-divider"></div>
            ${this.navItem('reports','Reports','reports')}
            ${this.navItem('settings','Settings','settings')}
          </div>
          <div class="spine-foot">
            <div style="color:rgba(243,236,218,0.75); font-weight:600; font-size:11.5px;">${esc(s.business.name)}</div>

          </div>

  navItem(tab, label, icon){
    const active = this.state.activeTab===tab;
    return `<div class="nav-item ${active?'active':''}" onclick="App.setTab('${tab}')">${ICONS[icon]}<span class="label">${label}</span></div>`;
  },

  renderPage(){
    switch(this.state.activeTab){
      case 'dashboard': return this.renderDashboard();
      case 'sales': return this.renderList('sales');
      case 'purchases': return this.renderList('purchases');
      case 'parties': return this.renderParties();
      case 'items': return this.renderItems();
      case 'payments': return this.renderPayments();
      case 'expenses': return this.renderExpenses();
      case 'reports': return this.renderReports();
      case 'settings': return this.renderSettings();

  topbar(title){
    const b = this.state.business;
    return `<div class="topbar">
      <div>
        <h1>${esc(title)}</h1>
        <div class="biz"><b>${esc(b.name)}</b>${b.gstin? ' &middot; GSTIN '+esc(b.gstin) : ''}</div>
      </div>
      <div class="today mono">${fmtDate(todayStr())}</div>
    </div>`;
  },

  /* ---------- dashboard ---------- */
  renderDashboard(){
    const s = this.state;
    const today = todayStr();
    const todaySales = s.invoices.filter(i=>i.date===today).reduce((a,i)=>a+i.total,0);
    const receivable = s.parties.filter(p=>p.type==='customer').reduce((a,p)=>a+Math.max(0,this.partyBalance(p)),0);
    const payable = s.parties.filter(p=>p.type==='supplier').reduce((a,p)=>a+Math.max(0,this.partyBalance(p)),0);
    const lowStock = s.items.filter(i=>i.stock<=i.lowStock);

    const activity = [];
    s.invoices.forEach(i=>activity.push({t:'Sale', date:i.date, ts:i.createdAt, label: i.id+' · '+(this.partyById(i.partyId)?.name||'Walk-in'), amt:i.total, color:'green'}));
    s.purchases.forEach(i=>activity.push({t:'Purchase', date:i.date, ts:i.createdAt, label: i.id+' · '+(this.partyById(i.partyId)?.name||''), amt:i.total, color:'red'}));
    s.payments.forEach(p=>activity.push({t: p.type==='in'?'Payment In':'Payment Out', date:p.date, ts:p.createdAt, label:(this.partyById(p.partyId)?.name||'')+' · '+p.mode, amt:p.amount, color: p.type==='in'?'green':'red'}));
    s.expenses.forEach(e=>activity.push({t:'Expense', date:e.date, ts:e.createdAt, label:e.category, amt:e.amount, color:'red'}));
    activity.sort((a,b)=> b.ts-a.ts);
    const recent = activity.slice(0,8);

    return `
      ${this.topbar('Dashboard')}
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-label">${ICONS.sales.replace('width="24" height="24"','width="12" height="12"')} Today's Sales</div>
          <div class="stat-value green">${fmt(todaySales)}</div>
          <div class="stat-foot">${s.invoices.filter(i=>i.date===today).length} invoice(s) today</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">To Receive</div>
          <div class="stat-value red">${fmt(receivable)}</div>
          <div class="stat-foot">from ${s.parties.filter(p=>p.type==='customer' && this.partyBalance(p)>0).length} customer(s)</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">To Pay</div>
          <div class="stat-value red">${fmt(payable)}</div>
          <div class="stat-foot">to ${s.parties.filter(p=>p.type==='supplier' && this.partyBalance(p)>0).length} supplier(s)</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Low Stock</div>
          <div class="stat-value ${lowStock.length? 'red':''}">${lowStock.length}</div>
          <div class="stat-foot">item(s) below reorder level</div>
        </div>
      </div>

      ${lowStock.length? `
      <div class="section-head"><h2>Low stock alerts</h2></div>
      <div class="card card-pad" style="margin-bottom:8px;">
        ${lowStock.map(i=>`<span class="chip chip-red" style="margin:3px 6px 3px 0;">${esc(i.name)} — ${i.stock} ${esc(i.unit)} left</span>`).join('')}
      </div>` : ''}

      <div class="section-head"><h2>Recent activity</h2></div>
      <div class="card">
        ${recent.length? `<table><thead><tr><th>Type</th><th>Details</th><th>Date</th><th class="num">Amount</th></tr></thead><tbody>
          ${recent.map(a=>`<tr><td><span class="chip ${a.color==='green'?'chip-green':'chip-red'}">${a.t}</span></td><td>${esc(a.label)}</td><td class="mono" style="color:var(--ink-faint); font-size:12px;">${fmtDate(a.date)}</td><td class="num ${a.color==='green'?'amt-green':'amt-red'}">${fmt(a.amt)}</td></tr>`).join('')}
        </tbody></table>` : this.emptyState('No activity yet', 'Record a sale, purchase, or payment to see it here.')}
      </div>
    `;
  },

  emptyState(lead, sub){
    return `<div class="empty">${ICONS.book}<div class="lead">${esc(lead)}</div><p>${esc(sub)}</p></div>`;
  },

  /* ---------- sales / purchases list ---------- */
  renderList(kind){
    const isSale = kind==='sales';
    const s = this.state;
    const data = isSale? s.invoices : s.purchases;
    const q = (s.search||'').toLowerCase();
    const rows = data.filter(d=>{
      if(!q) return true;
      const p = this.partyById(d.partyId);
      return d.id.toLowerCase().includes(q) || (p && p.name.toLowerCase().includes(q));
    }).slice().sort((a,b)=>b.createdAt-a.createdAt);

    return `
      ${this.topbar(isSale? 'Sales' : 'Purchases')}
      <div class="section-head">
        <h2>${isSale?'Invoices':'Purchase bills'}<span class="count">${data.length} total</span></h2>
        <button class="btn btn-primary" onclick="App.openDraft('${isSale?'sale':'purchase'}')">${ICONS.plus} New ${isSale?'Sale':'Purchase'}</button>
      </div>
      <div class="searchbar">${ICONS.search}<input placeholder="Search by ${isSale?'invoice no. or customer':'bill no. or supplier'}" value="${esc(s.search||'')}" oninput="App.state.search=this.value; App.renderListOnly();"></div>
      <div class="card" id="listCard">${this.listTable(kind, rows)}</div>
    `;
  },
  renderListOnly(){ const el = document.getElementById('listCard'); if(el){ const kind = this.state.activeTab; el.innerHTML = this.listTable(kind, this.filteredForList(kind)); } },
  filteredForList(kind){
    const isSale = kind==='sales';
    const data = isSale? this.state.invoices : this.state.purchases;
    const q = (this.state.search||'').toLowerCase();
    return data.filter(d=>{
      if(!q) return true;
      const p = this.partyById(d.partyId);
      return d.id.toLowerCase().includes(q) || (p && p.name.toLowerCase().includes(q));
    }).slice().sort((a,b)=>b.createdAt-a.createdAt);
  },
  listTable(kind, rows){
    const isSale = kind==='sales';
    if(!rows.length) return this.emptyState(isSale?'No sales yet':'No purchases yet', isSale? 'Create your first invoice to get started.' : 'Record your first purchase bill to get started.');
    return `<table><thead><tr>
        <th>${isSale?'Invoice':'Bill'} No.</th><th>Date</th><th>Party</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th></th>
      </tr></thead><tbody>
      ${rows.map(d=>{
        const p = this.partyById(d.partyId);
        const paid = this.state.payments.filter(x=>x.refType===(isSale?'invoice':'purchase') && x.refId===d.id).reduce((a,x)=>a+x.amount,0);
        const bal = d.total - paid;
        const status = bal<=0.005? 'Paid' : (paid>0? 'Partial' : 'Unpaid');
        const chipCls = status==='Paid'?'chip-green':(status==='Partial'?'chip-brass':'chip-red');
        return `<tr>
          <td class="mono" style="font-weight:600;">${d.id}</td>
          <td style="color:var(--ink-faint); font-size:12px;">${fmtDate(d.date)}</td>
          <td>${esc(p? p.name : '—')}</td>
          <td class="num">${fmt(d.total)}</td>
          <td class="num" style="color:var(--ink-faint);">${fmt(paid)}</td>
          <td class="num ${bal>0.005?'amt-red':'amt-green'}">${fmt(bal)}</td>
          <td><span class="chip ${chipCls}">${status}</span></td>
          <td><div class="row-actions">
            <button class="icon-btn" title="Print" onclick="event.stopPropagation(); App.printDocument('${isSale?'sale':'purchase'}','${d.id}')">${ICONS.print}</button>
            <button class="icon-btn" title="Delete" onclick="event.stopPropagation(); App.${isSale?'deleteInvoice':'deletePurchase'}('${d.id}')">${ICONS.trash}</button>
          </div></td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
  },

  /* ---------- draft modal (new sale/purchase) ---------- */
  renderDraftModal(){
    const d = this.draft;
    const isSale = d.kind==='sale';
    const parties = this.state.parties.filter(p=> isSale? p.type==='customer' : p.type==='supplier');
    const {subtotal, taxTotal, total} = this.draftTotals();
    return `
      <div class="modal-head"><h3>New ${isSale?'Sale':'Purchase'}</h3><button class="icon-btn" onclick="App.closeModal()">${ICONS.x}</button></div>

        <div class="field-row">
          <div class="field">
            <label>${isSale?'Customer':'Supplier'}</label>

              <option value="">Select ${isSale?'customer':'supplier'}…</option>
              ${parties.map(p=>`<option value="${p.id}" ${d.partyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Date</label>
            <input type="date" value="${d.date}" onchange="App.draftSetMeta('date', this.value)">
          </div>
        </div>

        <table class="line-table">
          <thead><tr><th style="width:34%;">Item</th><th style="width:14%;">Qty</th><th style="width:18%;">Rate</th><th style="width:10%;">Tax %</th><th style="width:18%;text-align:right;">Amount</th><th style="width:6%;"></th></tr></thead>
          <tbody>
          ${d.lines.map((l,idx)=>{
            const amt = (Number(l.qty)||0)*(Number(l.rate)||0);
            return `<tr>
              <td><select onchange="App.draftSetItem(${idx}, this.value)">
                <option value="">Select item…</option>
                ${this.state.items.map(it=>`<option value="${it.id}" ${l.itemId===it.id?'selected':''}>${esc(it.name)}</option>`).join('')}
              </select></td>

  /* ---------- reports ---------- */
  renderReports(){
    const tab = this.state.reportTab||'pl';
    return `
      ${this.topbar('Reports')}
      <div class="tabs-sub">
        <div class="tab-sub ${tab==='pl'?'active':''}" onclick="App.setReportTab('pl')">Profit &amp; Loss</div>
        <div class="tab-sub ${tab==='gst'?'active':''}" onclick="App.setReportTab('gst')">GST Summary</div>
        <div class="tab-sub ${tab==='stock'?'active':''}" onclick="App.setReportTab('stock')">Stock Report</div>
        <div class="tab-sub ${tab==='ledger'?'active':''}" onclick="App.setReportTab('ledger')">Party Statement</div>
      </div>
      ${tab==='pl'? this.reportPL() : tab==='gst'? this.reportGST() : tab==='stock'? this.reportStock() : this.reportLedger()}
    `;
  },
  reportPL(){
    const s = this.state;
    const sales = s.invoices.reduce((a,i)=>a+i.total,0);
    const purchases = s.purchases.reduce((a,i)=>a+i.total,0);
    const expenses = s.expenses.reduce((a,e)=>a+e.amount,0);
    const gross = sales - purchases;
    const net = gross - expenses;
    return `
      <div class="card card-pad" style="max-width:460px;">
        <div class="totals-row"><span>Total Sales</span><span class="val amt-green" style="font-family:'IBM Plex Mono';">${fmt(sales)}</span></div>
        <div class="totals-row"><span>Total Purchases</span><span class="val amt-red" style="font-family:'IBM Plex Mono';">- ${fmt(purchases)}</span></div>
        <div class="totals-row" style="border-top:1px dashed var(--rule); padding-top:8px; margin-top:4px;"><span><b>Gross Profit</b></span><span class="val" style="font-family:'IBM Plex Mono'; font-weight:700;">${fmt(gross)}</span></div>
        <div class="totals-row"><span>Total Expenses</span><span class="val amt-red" style="font-family:'IBM Plex Mono';">- ${fmt(expenses)}</span></div>
        <div class="totals-row grand"><span>Net Profit</span><span class="val ${net<0?'amt-red':'amt-green'}">${fmt(net)}</span></div>
      </div>
      <div class="hint" style="margin-top:10px;">Simplified statement across all recorded dates — total sales less purchase cost and expenses. Not a substitute for formal accounting.</div>
    `;
  },
  reportGST(){
    const s = this.state;
    const groupBy = (data)=>{
      const g = {};
      data.forEach(d=> d.lines.forEach(l=>{
        const rate = l.tax;
        const taxable = l.qty*l.rate;
        const taxAmt = taxable*rate/100;
        g[rate] = g[rate] || {taxable:0, tax:0};
        g[rate].taxable += taxable; g[rate].tax += taxAmt;
      }));
      return g;
    };
    const out = groupBy(s.invoices);
    const inp = groupBy(s.purchases);
    const rates = Array.from(new Set([...Object.keys(out), ...Object.keys(inp)])).sort((a,b)=>a-b);
    const totalOut = Object.values(out).reduce((a,v)=>a+v.tax,0);
    const totalIn = Object.values(inp).reduce((a,v)=>a+v.tax,0);
    return `
      <div class="card" style="max-width:720px;">
        <table><thead><tr><th>Tax Rate</th><th class="num">Taxable (Sales)</th><th class="num">Output GST</th><th class="num">Taxable (Purchases)</th><th class="num">Input GST</th></tr></thead>
        <tbody>
          ${rates.length? rates.map(r=>`<tr>
            <td style="font-weight:600;">${r}%</td>
            <td class="num">${fmt(out[r]?out[r].taxable:0)}</td>
            <td class="num amt-green">${fmt(out[r]?out[r].tax:0)}</td>
            <td class="num">${fmt(inp[r]?inp[r].taxable:0)}</td>

        </tbody></table>

  reportStock(){
    const s = this.state;
    const rows = s.items.slice().sort((a,b)=>a.name.localeCompare(b.name));
    const value = rows.reduce((a,i)=>a+i.stock*i.purchasePrice,0);
    return `
      <div class="card">
        ${rows.length? `<table><thead><tr><th>Item</th><th class="num">Stock</th><th>Unit</th><th class="num">Purchase Price</th><th class="num">Stock Value</th><th>Status</th></tr></thead><tbody>
        ${rows.map(i=>`<tr>
          <td style="font-weight:600;">${esc(i.name)}</td>
          <td class="num">${fmtInt(i.stock)}</td>
          <td style="color:var(--ink-faint); font-size:12.5px;">${esc(i.unit)}</td>
          <td class="num">${fmt(i.purchasePrice)}</td>
          <td class="num">${fmt(i.stock*i.purchasePrice)}</td>
          <td>${i.stock<=i.lowStock? '<span class="chip chip-red">Low</span>' : '<span class="chip chip-green">OK</span>'}</td>
        </tr>`).join('')}
        </tbody></table>` : this.emptyState('No items yet','Add items to see stock valuation.')}
      </div>
      <div class="hint" style="margin-top:10px;">Total stock value (at purchase price): <b class="mono">${fmt(value)}</b></div>
    `;
  },
  reportLedger(){
    const s = this.state;
    const pid = s.ledgerPartyId || (s.parties[0] && s.parties[0].id);
    const party = pid && this.partyById(pid);
    const options = s.parties.slice().sort((a,b)=>a.name.localeCompare(b.name));
    let body = '';
    if(!party){
      body = this.emptyState('No party selected', 'Add a party to view their statement.');
    } else {
      const txns = [];
      if(party.opening) txns.push({date:'', ts:-1, label:'Opening Balance', debit: party.type==='customer'? Math.max(party.opening,0):0, credit: party.type==='customer'? 0: Math.max(party.opening,0)});
      s.invoices.filter(i=>i.partyId===party.id).forEach(i=> txns.push({date:i.date, ts:i.createdAt, label:'Sale '+i.id, debit: party.type==='customer'? i.total:0, credit: party.type==='supplier'? i.total:0}));
      s.purchases.filter(i=>i.partyId===party.id).forEach(i=> txns.push({date:i.date, ts:i.createdAt, label:'Purchase '+i.id, debit: party.type==='supplier'? i.total:0, credit: party.type==='customer'? i.total:0}));
      s.payments.filter(p=>p.partyId===party.id).forEach(p=> txns.push({date:p.date, ts:p.createdAt, label:(p.type==='in'?'Payment Received':'Payment Paid')+(p.refId?' ('+p.refId+')':''), debit: (party.type==='customer'&&p.type==='in')||(party.type==='supplier'&&p.type==='out') ? 0: p.amount, credit: (party.type==='customer'&&p.type==='in')||(party.type==='supplier'&&p.type==='out') ? p.amount : 0}));
      txns.sort((a,b)=>a.ts-b.ts);
      let running = 0;
      const rowsHtml = txns.map(t=>{ running += t.debit - t.credit; return `<tr>
        <td style="color:var(--ink-faint); font-size:12px;">${t.date?fmtDate(t.date):'—'}</td>
        <td>${esc(t.label)}</td>
        <td class="num">${t.debit? fmt(t.debit) : ''}</td>
        <td class="num">${t.credit? fmt(t.credit) : ''}</td>
        <td class="num ${running>0?'amt-red':'amt-green'}">${fmt(Math.abs(running))} ${running>0? (party.type==='customer'?'Dr':'Dr') : ''}</td>
      </tr>`;}).join('');
      const bal = this.partyBalance(party);
      body = `
        <div class="balance-banner" style="background:${bal>0?'var(--red-wash)':'var(--green-wash)'};">
          <div><div class="l">${party.type==='customer'?'Amount receivable':'Amount payable'}</div></div>
          <div class="v ${bal>0?'amt-red':'amt-green'}">${fmt(Math.abs(bal))}</div>
        </div>
        <div class="card">
          <table><thead><tr><th>Date</th><th>Particulars</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
          <tbody>${txns.length? rowsHtml : `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--ink-faint);">No transactions with this party yet.</td></tr>`}</tbody></table>
        </div>
      `;
    }
    return `
      <div class="field" style="max-width:320px; margin-bottom:16px;">
        <label>Select party</label>
        <select onchange="App.state.ledgerPartyId=this.value; App.render();">
          ${options.map(p=>`<option value="${p.id}" ${pid===p.id?'selected':''}>${esc(p.name)} (${p.type})</option>`).join('')}
        </select>
      </div>
      ${body}
    `;
  },

        ` : `
          <p style="font-size:13px; color:var(--ink-soft); margin-top:0;">Paste your free Firebase project's web config below to switch Record Book to a real production backend (secure login + Firestore database + automatic daily backups, independent of Claude). Create a free project at <span class="mono">console.firebase.google.com</span> — enable <b>Email/Password</b> sign-in and create a <b>Firestore</b> database, then copy the config object from your app's settings.</p>

          ${Store.firebaseError? `<div class="auth-err" style="margin-top:8px;">${esc(Store.firebaseError)}</div>`:''}

          <button class="btn btn-primary" onclick="App.connectFirebase()">${ICONS.check} Connect &amp; reload</button>

  connectFirebase(){
    const raw = document.getElementById('fb_config').value.trim();
    let cfg;
    try{ cfg = JSON.parse(raw); }catch(e){ this.toast('That does not look like valid JSON','error'); return; }
    if(!cfg.apiKey || !cfg.projectId){ this.toast('Config is missing apiKey/projectId','error'); return; }
    CloudConfig.set(cfg);
    this.toast('Saved — reloading to connect…');
    setTimeout(()=> location.reload(), 500);
  },
  disconnectFirebase(){
    if(!confirm('Disconnect Firebase? You will be logged out and this device will fall back to local/Claude storage.')) return;
    CloudConfig.clear();
    location.reload();
  },
  async loadBackupList(){
    const el = document.getElementById('backupList');
    if(!el) return;
    const list = await this.listBackups();
    if(!document.getElementById('backupList')) return; // settings tab changed while loading
    document.getElementById('backupList').innerHTML = list.length? `<table><thead><tr><th>Date</th><th>Saved</th><th></th></tr></thead><tbody>
      ${list.map(b=>`<tr><td class="mono" style="font-weight:600;">${b.id}</td><td style="color:var(--ink-faint); font-size:12px;">${new Date(b.savedAt).toLocaleString('en-IN')}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="App.restoreBackup('${b.id}')">Restore</button></td></tr>`).join('')}
      </tbody></table>` : this.emptyState('No backups yet', 'Your first daily backup is saved automatically the moment you use the app today.');
  },
  exportBackup(){
    const blob = new Blob([JSON.stringify(this.state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'record-book-backup-'+todayStr()+'.json';
    a.click();
    this.toast('Backup downloaded');
  },
  importBackup(file){
    if(!file) return;
    if(!confirm('Importing will replace all current data for this account. Continue?')) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.parties)) throw new Error('bad file');
        this.state = data;
        if(!this.state.invoiceSettings) this.state.invoiceSettings = this.defaultState().invoiceSettings;
        this.persist(); this.render(); this.toast('Backup restored');
      }catch(e){ this.toast('Could not read that backup file','error'); }
    };
    reader.readAsText(file);
  },

          </div>
        </div>
        ${(inv.bank.accNumber||inv.bank.upi)? `<div style="margin-top:18px; font-size:12px; color:#5B5449;">
          <b>Payment details:</b>
          ${inv.bank.accName? ' '+esc(inv.bank.accName)+',':''}
          ${inv.bank.accNumber? ' A/C '+esc(inv.bank.accNumber)+',':''}
          ${inv.bank.ifsc? ' IFSC '+esc(inv.bank.ifsc)+',':''}
          ${inv.bank.upi? ' UPI: '+esc(inv.bank.upi):''}
        </div>`:''}
        ${inv.terms? `<div style="margin-top:14px; font-size:12px; color:#8B8271; border-top:1px dashed #CBB98D; padding-top:10px;">${esc(inv.terms)}</div>`:''}
      </div>
    `;
    let area = document.getElementById('printArea');
    if(!area){ area = document.createElement('div'); area.id='printArea'; document.body.appendChild(area); }
    area.innerHTML = html;
    window.print();
  }
};

App.init();
</script>
</body>
</html>
